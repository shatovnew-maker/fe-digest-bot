name: Ежедневная сводка

on:
  schedule:
    # Время в UTC. 21:47 UTC = 07:47 по Владивостоку (GitHub иногда запускает на 5–30 минут позже).
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "За сколько часов искать (пусто — как в config.yaml)"
        required: false
        default: ""

permissions:
  contents: write   # чтобы сохранять список уже отправленных ссылок

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать и отправить сводку
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOURS: ${{ github.event.inputs.hours }}
        run: python bot.py

      - name: Сохранить список отправленного
        if: success()
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "Обновить список отправленных ссылок" && git push)
