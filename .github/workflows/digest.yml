name: Ежедневная сводка

on:
  schedule:
    # Время в UTC (Владивосток = UTC+10). GitHub иногда запускает на 5–30 минут позже.
    - cron: "47 21 * * *"   # каждый день в 07:47 — сводка упоминаний
    - cron: "13 0 * * 5"    # по пятницам в 10:13 — пост рубрики «О чём пишут иностранные СМИ»
  workflow_dispatch:
    inputs:
      mode:
        description: "Что собрать"
        type: choice
        options: [daily, weekly]
        default: daily
      hours:
        description: "За сколько часов искать (пусто — как в config.yaml)"
        required: false
        default: ""

permissions:
  contents: write   # чтобы сохранять список уже отправленных ссылок

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Собрать и отправить
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOURS: ${{ github.event.inputs.hours }}
          MODE: ${{ github.event.schedule == '13 0 * * 5' && 'weekly' || github.event.inputs.mode || 'daily' }}
        run: python bot.py

      - name: Сохранить список отправленного
        if: success()
        run: |
          git config user.name "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Обновить список отправленных ссылок" && git push)
