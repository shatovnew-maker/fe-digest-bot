# Настройки бота. После правки файла бот подхватит изменения при следующем запуске.

timezone: Asia/Vladivostok      # в этом поясе показывается время публикаций
lookback_hours: 30              # за сколько часов назад искать (с запасом к суткам; дубли отсекаются)
translate_to: ru

# Что попадает в сводку
include_other_sources: true     # показывать и издания не из списка (отдельным блоком)
max_other_sources: 15           # не больше стольких материалов «прочих» изданий
max_items_per_outlet: 4         # не больше стольких материалов одного издания
max_quotes_per_item: 2          # сколько цитат брать из одной статьи
max_quote_chars: 240            # длина одной цитаты (длиннее обрезается вокруг ключевого слова)
send_empty: true                # присылать сообщение, даже если ничего не нашлось

sources:
  google_news: true
  bing_news: true

# Ключевые слова по языкам. Фразы из нескольких слов ищутся целиком.
# editions: в каких языковых версиях Google News искать (hl / gl / ceid).
languages:
  en:
    editions:
      - {hl: en-US, gl: US, ceid: "US:en"}
      - {hl: en-SG, gl: SG, ceid: "SG:en"}
      - {hl: en-GB, gl: GB, ceid: "GB:en"}
    bing: {setlang: en, cc: us}
    keywords:
      - Vladivostok
      - Primorye
      - Primorsky
      - Russian Far East
      - Russia's Far East
      - Far Eastern Federal
      - Khabarovsk
      - Sakhalin
      - Kamchatka
      - Kuril
      - Yakutia
      - Magadan
      - Chukotka
      - Blagoveshchensk
      - Birobidzhan
      - Nakhodka
      - Ussuriysk
      - Amur Oblast
      - Amur region
  ja:
    editions:
      - {hl: ja, gl: JP, ceid: "JP:ja"}
    bing: {setlang: ja, cc: jp}
    keywords:
      - ウラジオストク
      - 沿海地方
      - ロシア極東
      - ハバロフスク
      - サハリン
      - カムチャツカ
      - 北方領土
      - 国後島
      - 択捉島
      - 色丹島
      - 千島列島
      - ヤクーツク
      - マガダン
      - ナホトカ
  ko:
    editions:
      - {hl: ko, gl: KR, ceid: "KR:ko"}
    bing: {setlang: ko, cc: kr}
    keywords:
      - 블라디보스토크
      - 연해주
      - 러시아 극동
      - 하바롭스크
      - 사할린
      - 캄차카
      - 쿠릴
      - 야쿠츠크
      - 마가단
      - 나홋카
  zh-Hans:
    editions:
      - {hl: zh-CN, gl: CN, ceid: "CN:zh-Hans"}
    bing: {setlang: zh-hans, cc: cn}
    keywords:
      - 符拉迪沃斯托克
      - 海参崴
      - 滨海边疆区
      - 俄罗斯远东
      - 俄远东
      - 哈巴罗夫斯克
      - 伯力
      - 萨哈林
      - 库页岛
      - 堪察加
      - 布拉戈维申斯克
      - 雅库特
  zh-Hant:
    editions:
      - {hl: zh-TW, gl: TW, ceid: "TW:zh-Hant"}
      - {hl: zh-HK, gl: HK, ceid: "HK:zh-Hant"}
    bing: {setlang: zh-hant, cc: tw}
    keywords:
      - 海參崴
      - 符拉迪沃斯托克
      - 濱海邊疆區
      - 俄羅斯遠東
      - 俄遠東
      - 伯力
      - 庫頁島
      - 堪察加
      - 千島群島

# Еженедельный пост рубрики «О чём пишут иностранные СМИ»
weekly:
  lookback_hours: 168          # за какой период собирать (7 дней)
  cover: cover.jpg             # обложка рубрики (лежит рядом с bot.py)
  max_items: 6                 # не больше стольких сюжетов в посте
  max_summary_chars: 150       # длина строки-пересказа одного сюжета
  include_other_sources: true  # если изданий из списка мало — добирать из прочих
  reserve_items: 8             # сколько запасных сюжетов прислать отдельным сообщением
  intro: ""                    # строка перед списком (пусто — без неё)
  hashtag: ""                  # например "#ИноСМИоДВ" (пусто — без хештега)
  footer: '▪️ РБК Восток в <a href="https://t.me/prim_rbc">Telegram</a> и <a href="https://max.ru/prim_rbc">MAX</a>'

# Издания из вашего списка. domains: домены сайта (поддомены подхватываются автоматически).
