# Кого не показывать вовсе: российские СМИ (нужен взгляд извне),
# перепечатки-агрегаторы (дают дубли) и шум (ставки, спортивные счета).
exclude_domains:
  - .ru
  - .su
  - .by
  - tass.com
  - rt.com
  - sputnikglobe.com
  - sputniknews.com
  - rbth.com
  - msn.com
  - msn.cn
  - yahoo.com
  - yahoo.co.jp
  - news.google.com
  - note.com
  - infoseek.co.jp
  - livedoor.com
  - auone.jp
  - smartnews.com
  - sofascore.com
  - flashscore.com
  - oddsscanner.net
